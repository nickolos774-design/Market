<div class="register-page">
  <div class="dragon-image">
    <img src="../../FOTO/green-dragon.png" alt="Zielony Smok">
  </div>
  
  <div class="register-form">
    <h2>Zaloguj się</h2>
    
    <input type="email" id="email" placeholder="E-mail">
    <div class="password-fields">
      <div class="input-group">
        <input type="password" id="password" placeholder="Hasło">
      </div>
    </div>
    
    <button class="login-button">Zaloguj się</button>
    
    <div class="login-link">
      Nie masz konta? <a href="regestracja.html">Zarejestruj się</a>
    </div>
  </div>
</div>

<script>
  const loginButton = document.querySelector('.login-button');

  loginButton.addEventListener('click', function (e) {
      e.preventDefault();
  
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
  
      if (!email || !password) {
          alert('Wprowadź e-mail i hasło.');
          return;
      }
  
      fetch('../Php_files/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
      })
      .then(res => res.json())
      .then(data => {
          if (data.success) {
              switch (data.role) {
                  case 'admin':
                      window.location.href = "../../Admin/Admin_panel.php"; 
                      break;
                  case 'employee':
                      window.location.href = "../../Pracownik/pracownikpanel.php"; 
                      break;
                  case 'client':
                  default:
                      window.location.href = "../../Index/Php_files/Index.php"; 
                      break;
              }
          } else {
              alert('Błąd: ' + data.message);
          }
      })
      .catch(err => {
          console.error('Błąd:', err);
      });
  });
  
</script>
