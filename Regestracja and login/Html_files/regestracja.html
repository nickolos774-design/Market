  <script>
    const inputs = document.querySelectorAll('.register-form input');
    const registerButton = document.querySelector('.register-button');
  
    const firstName = inputs[0];
    const lastName = inputs[1];
    const email = inputs[2];
    const password = inputs[3];
    const confirmPassword = inputs[4];
  
    function setError(input, message) {
      let error = input.nextElementSibling;
      if (!error || !error.classList.contains('error-message')) {
        error = document.createElement('div');
        error.classList.add('error-message');
        input.parentNode.insertBefore(error, input.nextSibling);
      }
      error.innerHTML = message; // ВАЖНО: innerHTML, чтобы поддерживать ссылки
      input.style.borderColor = 'red';
    }
  
    function clearError(input) {
      let error = input.nextElementSibling;
      if (error && error.classList.contains('error-message')) {
        error.remove();
      }
      input.style.borderColor = '';
    }
  
    const nameRegex = /^[A-Za-zżźćńółęąśŻŹĆĄŚĘŁÓŃ\s]*$/;
    const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  
    function validateInput(input, regex, errorMessage) {
      if (input.value.trim() === '') {
        clearError(input);
      } else if (!regex.test(input.value.trim())) {
        setError(input, errorMessage);
      } else {
        clearError(input);
      }
    }
  
    firstName.addEventListener('input', () => {
      validateInput(firstName, nameRegex, 'Imię może zawierać tylko litery.');
    });
  
    lastName.addEventListener('input', () => {
      validateInput(lastName, nameRegex, 'Nazwisko może zawierać tylko litery.');
    });
  
    password.addEventListener('input', () => {
      validateInput(password, passwordRegex, 'Hasło musi mieć min. 8 znaków, cyfrę i znak specjalny.');
    });
  
    confirmPassword.addEventListener('input', () => {
      if (confirmPassword.value.trim() === '') {
        clearError(confirmPassword);
      } else if (confirmPassword.value.trim() !== password.value.trim()) {
        setError(confirmPassword, 'Hasła nie są takie same.');
      } else {
        clearError(confirmPassword);
      }
    });
  
    let debounceTimer;
  
    email.addEventListener('input', () => {
      validateInput(email, emailRegex, 'Wprowadź poprawny adres email.');
      
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (emailRegex.test(email.value.trim())) {
          checkEmailAvailability(email.value.trim());
        }
      }, 500);
    });
  
   function checkEmailAvailability(emailValue) {
  fetch('../Php_files/check_email.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailValue })
  })
  .then(response => response.json())
  .then(data => {
    if (!data.success) {
      setError(email, data.message + ' <a href="Login.html" style="color: blue; text-decoration: underline;">Proszę zalogować się</a>.');
    } else {
      clearError(email);
    }
  })
  .catch(error => {
    console.error('Ошибка проверки e-mail:', error);
    setError(email, 'Błąd połączenia z serwerem.');
  });
}


  
    registerButton.addEventListener('click', function (e) {
      e.preventDefault();
  
      let hasError = false;
  
      if (!nameRegex.test(firstName.value.trim())) {
        setError(firstName, 'Imię może zawierać tylko litery.');
        hasError = true;
      }
  
      if (!nameRegex.test(lastName.value.trim())) {
        setError(lastName, 'Nazwisko może zawierać tylko litery.');
        hasError = true;
      }
  
      if (!emailRegex.test(email.value.trim())) {
        setError(email, 'Wprowadź poprawny adres email.');
        hasError = true;
      }
  
      if (!passwordRegex.test(password.value.trim())) {
        setError(password, 'Hasło musi mieć min. 8 znaków, cyfrę i znak specjalny.');
        hasError = true;
      }
  
      if (password.value.trim() !== confirmPassword.value.trim()) {
        setError(confirmPassword, 'Hasła nie są takie same.');
        hasError = true;
      }
  
      if (!hasError) {
        const userData = {
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          email: email.value.trim(),
          password: password.value.trim()
        };
  
        fetch('../Php_files/register.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(userData)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('Rejestracja zakończona sukcesem!');
            inputs.forEach(input => {
              input.value = '';
              clearError(input);
            });
          } else {
            alert('Błąd: ' + data.message);
          }
        })
        .catch(error => {
          console.error('Ошибка:', error);
          alert('Wystąpił problem z rejestracją.');
        });
      }
    });
  </script>
